<!doctype html>
<html lang="en">
    <head>
        <link rel="manifest" href="manifest.json" />

        <!-- ios support -->
        <link rel="icon" href="icons/icon_small.png" type="image/png" />
        <link rel="apple-touch-icon" href="icons/icon_medium.png" />
        <meta name="msapplication-TileImage" content="icons/icon_large.png" />
        <meta name="msapplication-TileColor" content="#0d1b2a" />
        <meta name="theme-color" content="#0d1b2a" />
        <meta name="mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-status-bar-style" content="black" />
        <meta name="apple-mobile-web-app-title" content="WC Planner" />

        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <script src="https://maps.googleapis.com/maps/api/js?key=%REACT_APP_GOOGLE_MAPS_API_KEY%&libraries=places"></script>
        <title>World Cup Planner</title>

        <script>
            window.addEventListener("load", () => {
                if ("serviceWorker" in navigator) {
                    navigator.serviceWorker.register("sw.js");
                }
            });
        </script>
    </head>
    <body>
        <div id="root"></div>
    </body>
</html>
